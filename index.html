<!DOCTYPE html><html lang='es'><head><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1'><meta name='theme-color' content='#0B1220'><link rel='manifest' href='manifest.json'><title>Proyecto 13 Semanas</title><style>body{font-family:-apple-system;background:#0B1220;color:#fff;margin:0;padding:20px;max-width:420px} .c{background:#111827;border-radius:16px;padding:16px;margin:12px 0} button{width:100%;padding:14px;border:0;border-radius:12px;background:#2563EB;color:#fff;font-size:18px}</style></head><body><h1>Proyecto 13 Semanas</h1><div class='c'><h2 id='d'></h2><div id='r'></div></div><div class='c'><div id='t' style='font-size:42px;text-align:center'>20:00</div><button onclick='go()'>Empezar</button></div><div class='c'><label><input id=w type=checkbox> Entrené</label><br><label><input id=c type=checkbox> Creatina</label><br><label><input id=p type=checkbox> Proteína</label><br><label><input id=a type=checkbox> Agua 2L</label></div><script>const R={Lunes:['15 Sentadillas','10 Flexiones','15 Remo','20 Puente','40s Plancha'],Martes:['Movilidad 10 min','Entrenador 20:00'],Miércoles:['10 Búlgaras','8 Pike Push-up','15 Hip Thrust','15 Face Pull'],Jueves:['Movilidad','Entrenador'],Viernes:['3 vueltas cuerpo completo'],Sábado:['Caminar 45 min'],Domingo:['Revisión']};const D=['Domingo','Lunes','Martes','Miércoles','Jueves','Viernes','Sábado'];let d=D[new Date().getDay()];document.getElementById('d').textContent=d;document.getElementById('r').innerHTML='<ul>'+R[d].map(x=>'<li>'+x+'</li>').join('')+'</ul>';let s=1200,i;function f(){let m=Math.floor(s/60),ss=s%60;document.getElementById('t').textContent=String(m).padStart(2,'0')+':'+String(ss).padStart(2,'0')}f();function go(){if(i){clearInterval(i);i=null;return;}i=setInterval(()=>{s--;f();if(s<=0){clearInterval(i);alert('¡Terminado!');}},1000);}if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js');</script></body></html>
